[package]
name = "musemark"
version = "1.1.0"
description = "Offline Markdown editor and media viewer"
authors = ["Brian98Z"]
license = "MIT"
edition = "2021"

[lib]
name = "musemark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

parking_lot = "0.12"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"
