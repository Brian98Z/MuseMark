name: Build macOS
on:
  workflow_dispatch:
  push:
    tags: ['build-platforms-*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run dist:mac:${{ matrix.arch }}
      - name: Verify DMG, native architecture, signature, and window
        shell: bash
        run: |
          set -euo pipefail
          for image in release/macos/*.dmg; do hdiutil verify "$image"; done
          image=$(find release/macos -maxdepth 1 -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/musemark-dmg"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          app="$mount/MuseMark.app"
          executable="$app/Contents/MacOS/musemark"
          arch='${{ matrix.arch }}'
          if [ "$arch" = x64 ]; then arch=x86_64; fi
          lipo "$executable" -verify_arch "$arch"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$executable" > "$RUNNER_TEMP/musemark-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; hdiutil detach "$mount" || true' EXIT
          sleep 10
          if ! kill -0 "$pid"; then cat "$RUNNER_TEMP/musemark-smoke.log"; exit 1; fi
          osascript -e 'tell application "System Events" to get name of every process whose name is "musemark"'
          screencapture -x "$RUNNER_TEMP/musemark-smoke.png"
          shasum -a 256 release/macos/*.dmg > release/macos/SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MuseMark-mac-${{ matrix.arch }}
          if-no-files-found: error
          path: release/macos/*
