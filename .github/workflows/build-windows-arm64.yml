name: Build Windows ARM64
on:
  workflow_dispatch:
  push:
    tags: ['build-platforms-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: npm ci
      - run: npm run dist:win:arm64
      - name: Verify native ARM64 payload
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path src-tauri/target/aarch64-pc-windows-msvc/release/musemark.exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xaa64) { throw 'Not ARM64' }
          Get-FileHash release/windows/*-win-arm64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/windows/SHA256SUMS-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MuseMark-win-arm64
          if-no-files-found: error
          path: |
            release/windows/*-win-arm64.exe
            release/windows/SHA256SUMS-arm64.txt
