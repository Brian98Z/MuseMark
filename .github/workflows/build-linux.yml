name: Build Linux
on:
  workflow_dispatch:
  push:
    tags: ['build-platforms-*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool openbox dbus-x11
      - run: npm ci
      - run: npm run dist:linux:${{ matrix.arch }}
      - name: Verify DEB and launch native application
        shell: bash
        run: |
          set -euo pipefail
          for package in release/linux/*.deb; do
            dpkg-deb --info "$package"
            test "$(dpkg-deb -f "$package" Architecture)" = "$(dpkg --print-architecture)"
            sudo apt-get install -y "$PWD/$package"
          done
          for image in release/linux/*.AppImage; do chmod +x "$image"; "$image" --appimage-extract >/dev/null; test -e squashfs-root/AppRun; done
          xvfb-run -a dbus-run-session -- bash -c '
            openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
            musemark > "$RUNNER_TEMP/musemark-smoke.log" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for attempt in {1..30}; do
              if ! kill -0 "$pid"; then cat "$RUNNER_TEMP/musemark-smoke.log"; exit 1; fi
              if xdotool search --onlyvisible --name MuseMark > "$RUNNER_TEMP/musemark-windows.txt"; then cat "$RUNNER_TEMP/musemark-windows.txt"; exit 0; fi
              sleep 1
            done
            cat "$RUNNER_TEMP/musemark-smoke.log"
            xwininfo -root -tree
            exit 1
          '
          sha256sum release/linux/*.deb release/linux/*.AppImage > release/linux/SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MuseMark-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: release/linux/*
